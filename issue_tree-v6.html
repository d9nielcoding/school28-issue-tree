<style>
:root {
  color-scheme: light;
  --plane:   #eef1f5;
  --surface: #ffffff;
  --ink:     #1f2a37;
  --ink-2:   #4b5563;
  --ink-3:   #79838f;
  --rule:    #e4e8ee;
  --focus:   #2b6cb0;
  --font-display: "Noto Serif TC", "Songti TC", Georgia, serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;

  --shadow: 0 1px 2px rgba(31,42,55,.05), 0 14px 32px -20px rgba(31,42,55,.35);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  background: var(--plane);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
.card {
  width: 100%;
  max-width: 560px;
  padding: 34px 36px 30px;
  background: var(--surface);
  border-radius: 10px;
  box-shadow: var(--shadow);
}
@media (max-width: 520px) { .card { padding: 26px 20px 24px; } }
.eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: .16em;
  color: var(--ink-3);
  margin: 0 0 8px;
}
h1 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(22px, 5vw, 28px);
  line-height: 1.4;
  margin: 0 0 12px;
}
p { margin: 0 0 14px; color: var(--ink-2); }
.go {
  display: inline-block;
  margin-top: 4px;
  padding: 9px 18px;
  border-radius: 6px;
  background: var(--focus);
  color: #fff;
  font-weight: 700;
  text-decoration: none;
}
.go:hover { filter: brightness(1.08); }
.go:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.note {
  margin: 20px 0 0;
  padding-top: 14px;
  border-top: 1px solid var(--rule);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: .04em;
  color: var(--ink-3);
}
</style>
